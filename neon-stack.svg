    .chip  { font: 500 15px 'JetBrains Mono','Fira Code','Consolas','Courier New',monospace; }
    .pill  { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.7 } 50% { opacity:1 } }
  </style>
  <rect width="960" height="382" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="378" rx="17" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
