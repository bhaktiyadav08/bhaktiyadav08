<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="9" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/><stop offset="1" stop-color="#0a0420"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#b44bff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b1148" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .name { font: 800 66px 'JetBrains Mono','Fira Code','Consolas','Courier New',monospace; letter-spacing: 6px; }
    .sub  { font: 500 19px 'JetBrains Mono','Fira Code','Consolas','Courier New',monospace; letter-spacing: 7px; }
    .tag  { font: 400 13px 'JetBrains Mono','Fira Code','Consolas','Courier New',monospace; letter-spacing: 2px; fill:#6f63b8; }
    .flick { animation: flick 5s infinite; }
    @keyframes flick {
      0%,18%,22%,62%,64%,100% { opacity:1 }
      20%,63% { opacity:.25 }
    }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .dash { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3s ease forwards, pulse 3s 3s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
  </style>
  <rect width="960" height="240" rx="18" fill="url(#bg)"/>
  <rect width="960" height="240" rx="18" fill="url(#grid)" opacity=".6"/>
  <rect x="2" y="2" width="956" height="236" rx="17" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#glow)" class="pulse"/>

  <text x="480" y="52" text-anchor="middle" class="tag">// hello, world &#8212; i am</text>

  <g filter="url(#glow)">
    <text x="480" y="130" text-anchor="middle" class="name" fill="#00f0ff">BHAK<tspan class="flick" fill="#ff2bd6">T</tspan>I <tspan fill="#ff2bd6">YADAV</tspan></text>
  </g>

  <path class="dash" d="M130 154 H830" stroke="url(#line)" stroke-width="3" fill="none" filter="url(#glow)"/>

  <g filter="url(#glow)">
    <text x="480" y="196" text-anchor="middle" class="sub" fill="#39ff14">FULL-STACK <tspan fill="#b44bff">//</tspan> ML ENGINEER<tspan class="blink" fill="#00f0ff">_</tspan></text>
  </g>
</svg>
